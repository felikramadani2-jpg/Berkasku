name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Pasang XcodeGen
        run: brew install xcodegen

      - name: Buat proyek Xcode
        run: xcodegen

      - name: Build (tanpa tanda tangan)
        run: |
          set -o pipefail
          xcodebuild \
            -project BerkasKu.xcodeproj \
            -scheme BerkasKu \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" 2>&1 | tee build.log || {
            grep -E "error:" build.log | sort -u | head -20 | while read -r l; do echo "::error::$l"; done
            exit 1
          }

      - name: Kemas jadi IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/BerkasKu.app Payload/
          zip -r BerkasKu.ipa Payload

      - name: Unggah IPA
        uses: actions/upload-artifact@v4
        with:
          name: BerkasKu-ipa
          path: BerkasKu.ipa
